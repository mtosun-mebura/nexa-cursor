# Server-deploy (TEST Proxmox + PROD AWS): backend + PostgreSQL in Docker.
# Geen `include` — compatibel met docker-compose v1 én `docker compose` v2.
# Lokaal op je laptop: docker-compose.yml (dev, live code-mount).
# DB-credentials en APP_KEY: repo-root .env (bind-mount). In de container: DB_HOST=db.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nexa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Zet DB_PASSWORD in .env (repo-root)}
      POSTGRES_DB: ${DB_DATABASE:-nexa}
    volumes:
      - nexa_postgres_data:/var/lib/postgresql/data
    # Host-bind nodig voor tenant-sync SSH-tunnels (remote 127.0.0.1:5432).
    # Deploy-script ruimt legacy project "current" / bezette 5432 op vóór compose up.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${DB_USERNAME:-nexa}" -d "${DB_DATABASE:-nexa}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    # Coolify Domains: ALLEEN apex (+ www), NOOIT *.nexasuite.nl of losse tenants.
    #   https://nexasuite.nl:8000,https://www.nexasuite.nl:8000
    # (:8000 = containerpoort; publiek blijft https://… zonder poort)
    # Tenant-subdomeinen: Traefik HostRegexp hieronder — zie deploy/COOLIFY-WILDCARD-TENANTS.md
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8085:8000"
    labels:
      - traefik.enable=true
      # Poort voor custom routers (Coolify voegt daarnaast eigen http-0/https-0 services toe).
      # Geen traefik.docker.network=coolify: backend zit op het app-netwerk (UUID), níet op coolify.
      # Alleen zetten als de container op meerdere netwerken hangt:
      #   TRAEFIK_DOCKER_NETWORK=<uuid-netwerk>  (zelfde als coolify-proxy ∩ backend)
      - traefik.http.services.backend.loadbalancer.server.port=8000
      # --- Apex + www (hoge priority) ---
      - traefik.http.routers.nexa-saas-http.entryPoints=http
      - traefik.http.routers.nexa-saas-http.middlewares=redirect-to-https
      - traefik.http.routers.nexa-saas-http.rule=Host(`nexasuite.nl`) || Host(`www.nexasuite.nl`)
      - traefik.http.routers.nexa-saas-http.priority=100
      - traefik.http.routers.nexa-saas-http.service=backend
      - traefik.http.routers.nexa-saas-https.entryPoints=https
      - traefik.http.routers.nexa-saas-https.rule=Host(`nexasuite.nl`) || Host(`www.nexasuite.nl`)
      - traefik.http.routers.nexa-saas-https.priority=100
      - traefik.http.routers.nexa-saas-https.tls=true
      - traefik.http.routers.nexa-saas-https.tls.certresolver=letsencrypt
      - traefik.http.routers.nexa-saas-https.middlewares=gzip
      - traefik.http.routers.nexa-saas-https.service=backend
      # --- Tenant-subdomeinen ---
      # HostRegexp vangt álles; reserved hosts uitsluiten met !Host (géén RE2-lookahead).
      # Zie deploy/COOLIFY-WILDCARD-TENANTS.md — Coolify-apps voor panel/n8n/automations moeten
      # hun eigen Host(`…`) hebben, anders 404 i.p.v. Nexa.
      - traefik.http.routers.nexa-saas-tenants-http.entryPoints=http
      - traefik.http.routers.nexa-saas-tenants-http.middlewares=redirect-to-https
      - traefik.http.routers.nexa-saas-tenants-http.rule=HostRegexp(`^[a-z0-9-]+\.nexasuite\.nl$`) && !Host(`panel.nexasuite.nl`) && !Host(`n8n.nexasuite.nl`) && !Host(`automations.nexasuite.nl`) && !Host(`www.nexasuite.nl`)
      - traefik.http.routers.nexa-saas-tenants-http.priority=1
      - traefik.http.routers.nexa-saas-tenants-http.service=backend
      - traefik.http.routers.nexa-saas-tenants-https.entryPoints=https
      - traefik.http.routers.nexa-saas-tenants-https.rule=HostRegexp(`^[a-z0-9-]+\.nexasuite\.nl$`) && !Host(`panel.nexasuite.nl`) && !Host(`n8n.nexasuite.nl`) && !Host(`automations.nexasuite.nl`) && !Host(`www.nexasuite.nl`)
      - traefik.http.routers.nexa-saas-tenants-https.priority=1
      - traefik.http.routers.nexa-saas-tenants-https.tls=true
      - traefik.http.routers.nexa-saas-tenants-https.tls.certresolver=letsencrypt
      - traefik.http.routers.nexa-saas-tenants-https.middlewares=gzip
      - traefik.http.routers.nexa-saas-tenants-https.service=backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Zet APP_URL in Coolify/.env op het echte publieke adres (http of https).
      # Verkeerde APP_URL → Secure-sessiecookies op HTTP → inloggen lijkt te werken maar sessie blijft niet.
      APP_URL: ${APP_URL:-https://nexasuite.nl}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"

      # `php artisan serve` (PHP built-in server) draait standaard single-threaded: 1 request tegelijk.
      # Met meerdere workers worden requests parallel afgehandeld, zodat één trage request niet de hele
      # site (incl. /admin) blokkeert. Vereist een OS met fork (Linux) – geldt voor deze container.
      PHP_CLI_SERVER_WORKERS: "8"

      N8N_URL: https://n8n.tosun.nl
      N8N_PORT: "5678"
      N8N_EMAIL: m.tosun@mebura.nl

    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
      - ./backend/public/build:/var/www/html/public/build
      - ./.env:/var/www/html/.env
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "php", "-r", "exit((int)!@fsockopen('127.0.0.1',8000));"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  nexa_postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-nexa}_postgres_data
