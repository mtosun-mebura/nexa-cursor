# Start Create PROD tag op branch main zodra release/test via PR naar main is gemerged.
# Daardoor staat de daadwerkelijke tag-run in GitHub Actions op branch main.

name: Queue PROD tag after release/test merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: read

jobs:
  queue-prod-tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/test'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Create PROD tag on main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'create-prod-tag.yml';
            const ref = 'main';
            const maxAttempts = 8;
            const baseDelayMs = 15000;

            // Na merge kan de Actions-API kort 500 geven (race/outage). Wacht + retry.
            core.info('Wacht kort tot main/workflows stabiel zijn na merge...');
            await new Promise((r) => setTimeout(r, 10000));

            let lastError = null;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id,
                  ref,
                  inputs: {
                    bump_type: 'patch',
                  },
                });
                core.info(`Create PROD tag gestart op ref main (poging ${attempt}/${maxAttempts}).`);
                return;
              } catch (error) {
                lastError = error;
                const status = error?.status || error?.response?.status;
                const msg = [error?.message, error?.response?.data?.message].filter(Boolean).join(' ');
                const retryable = status === 500 || status === 502 || status === 503 || status === 504
                  || /Failed to run workflow dispatch|server error|timed out|ECONNRESET/i.test(msg);

                core.warning(`Dispatch poging ${attempt}/${maxAttempts} mislukt (${status || 'n/a'}): ${msg}`);
                if (!retryable || attempt === maxAttempts) {
                  break;
                }
                const delay = baseDelayMs * attempt;
                core.info(`Retry over ${Math.round(delay / 1000)}s...`);
                await new Promise((r) => setTimeout(r, delay));
              }
            }

            core.setFailed(
              `Kon Create PROD tag niet starten na ${maxAttempts} pogingen: ${lastError?.message || lastError}`
            );
