# Vernieuw SSL op PROD (Hostinger / nexasuite.online) via self-hosted runner.
name: Renew SSL PROD

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forceer vernieuwing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renew-ssl-production
  cancel-in-progress: false

jobs:
  renew-ssl:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production

    steps:
      - name: Resolve PROD SSH credentials
        id: ssh
        run: |
          set -euo pipefail
          host="${{ secrets.HOSTINGER_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.AWS_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.DEPLOY_HOST }}"
          user="${{ secrets.HOSTINGER_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.AWS_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.DEPLOY_USER }}"
          port="${{ secrets.HOSTINGER_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.AWS_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.DEPLOY_PORT }}"
          port="${port:-22}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Preflight SSH
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          timeout 25 bash -c "echo >/dev/tcp/${SSH_HOST}/${port}"

      # script_stop:true breekt multiline/|| scripts (DRONE_SSH_PREV_COMMAND_EXIT_CODE).
      - name: Renew Let's Encrypt + reload nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          FORCE_RENEW: ${{ inputs.force }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.AWS_SSH_KEY || secrets.DEPLOY_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          timeout: 60s
          command_timeout: 25m
          script_stop: false
          envs: APP_DIR,FORCE_RENEW
          script: |
            set -euo pipefail
            echo "=== Diagnose ==="
            whoami
            id
            docker info >/dev/null 2>&1 && echo "docker: OK" || echo "docker: FAIL"
            openssl s_client -connect www.nexasuite.online:443 -servername www.nexasuite.online </dev/null 2>/dev/null | openssl x509 -noout -dates -subject || true

            FORCE_FLAG=""
            if [ "${FORCE_RENEW:-false}" = "true" ]; then
              FORCE_FLAG="--force-renewal"
            fi

            WEBROOT=""
            for d in ${APP_DIR:+"${APP_DIR}/backend/public" "${APP_DIR}/public" "${APP_DIR}"} \
              /home/ubuntu/nexasuite/backend/public \
              /home/ubuntu/nexa-cursor/backend/public \
              /var/www/html/public \
              /var/www/certbot
            do
              if [ -n "$d" ] && [ -d "$d" ]; then
                WEBROOT="$d"
                break
              fi
            done
            WEBROOT="${WEBROOT:-/var/www/certbot}"
            mkdir -p "${WEBROOT}/.well-known/acme-challenge"
            echo "WEBROOT=$WEBROOT"

            echo "=== docker certbot HTTP-01 (www + app; apex zit achter Cloudflare) ==="
            docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/log/letsencrypt:/var/log/letsencrypt \
              -v "${WEBROOT}:/webroot" \
              certbot/certbot certonly --webroot -w /webroot \
              -d www.nexasuite.online -d app.nexasuite.online -d nexasuite.online \
              --agree-tos --non-interactive --expand ${FORCE_FLAG} \
              --cert-name nexasuite.online \
              -m admin@nexasuite.online

            if sudo -n true 2>/dev/null; then
              sudo -n nginx -t
              sudo -n systemctl reload nginx
            else
              name=$(docker ps --format '{{.Names}}' | grep -iE 'nginx|coolify-proxy|traefik' | head -1 || true)
              if [ -n "${name:-}" ]; then
                echo "Reload container: $name"
                docker exec "$name" nginx -s reload 2>/dev/null || docker kill -s HUP "$name" 2>/dev/null || true
              else
                echo "WARN: cert OK, reload nginx handmatig: sudo systemctl reload nginx"
              fi
            fi

            echo "=== Na renew ==="
            openssl s_client -connect www.nexasuite.online:443 -servername www.nexasuite.online </dev/null 2>/dev/null | openssl x509 -noout -dates -subject || true
            openssl s_client -connect app.nexasuite.online:443 -servername app.nexasuite.online </dev/null 2>/dev/null | openssl x509 -noout -dates -subject || true
