# Vernieuw SSL op PROD (Hostinger) via self-hosted runner.
name: Renew SSL PROD

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forceer vernieuwing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renew-ssl-production
  cancel-in-progress: false

jobs:
  renew-ssl:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production

    steps:
      - name: Resolve PROD SSH credentials
        id: ssh
        run: |
          set -euo pipefail
          host="${{ secrets.HOSTINGER_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.AWS_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.DEPLOY_HOST }}"
          user="${{ secrets.HOSTINGER_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.AWS_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.DEPLOY_USER }}"
          port="${{ secrets.HOSTINGER_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.AWS_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.DEPLOY_PORT }}"
          port="${port:-22}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Preflight SSH
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          timeout 25 bash -c "echo >/dev/tcp/${SSH_HOST}/${port}"

      - name: Renew Let's Encrypt + reload nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.AWS_SSH_KEY || secrets.DEPLOY_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          timeout: 60s
          command_timeout: 25m
          script_stop: true
          envs: APP_DIR
          script: |
            set -euo pipefail
            echo "=== Diagnose ==="
            whoami; id
            sudo -n true 2>/dev/null && echo "sudo -n: OK" || echo "sudo -n: FAIL"
            docker info >/dev/null 2>&1 && echo "docker: OK" || echo "docker: FAIL"
            echo | openssl s_client -connect nexasuite.online:443 -servername nexasuite.online 2>/dev/null \
              | openssl x509 -noout -dates -subject || true

            FORCE_FLAG=""
            if [ "${{ inputs.force }}" = "true" ]; then
              FORCE_FLAG="--force-renewal"
            fi

            # Zoek een public webroot die via HTTPS bereikbaar is (Laravel public).
            CANDIDATES=()
            if [ -n "${APP_DIR:-}" ]; then
              CANDIDATES+=("${APP_DIR}/backend/public" "${APP_DIR}/public" "${APP_DIR}")
            fi
            CANDIDATES+=(
              /home/ubuntu/nexasuite/backend/public
              /home/ubuntu/nexa-cursor/backend/public
              /var/www/html/public
              /var/www/certbot
            )
            WEBROOT=""
            for d in "${CANDIDATES[@]}"; do
              if [ -d "$d" ]; then
                WEBROOT="$d"
                break
              fi
            done
            if [ -z "$WEBROOT" ]; then
              # Docker kan als root alsnog /var/www/certbot aanmaken
              WEBROOT=/var/www/certbot
            fi
            echo "WEBROOT=$WEBROOT"

            echo "=== docker certbot HTTP-01 ==="
            docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/log/letsencrypt:/var/log/letsencrypt \
              -v "${WEBROOT}:/webroot" \
              certbot/certbot certonly --webroot -w /webroot \
              -d nexasuite.online -d www.nexasuite.online -d app.nexasuite.online \
              --agree-tos --non-interactive --expand ${FORCE_FLAG} \
              --cert-name nexasuite.online \
              -m admin@nexasuite.online

            # Reload nginx: sudo -n of nginx-container
            if sudo -n true 2>/dev/null; then
              sudo -n nginx -t
              sudo -n systemctl reload nginx
            elif docker ps --format '{{.Names}}' | grep -qiE 'nginx|coolify-proxy|traefik'; then
              name=$(docker ps --format '{{.Names}}' | grep -iE 'nginx|coolify-proxy|traefik' | head -1)
              echo "Reload container: $name"
              docker exec "$name" nginx -s reload 2>/dev/null \
                || docker kill -s HUP "$name" 2>/dev/null \
                || true
            else
              echo "WARN: cert OK, reload nginx handmatig: sudo systemctl reload nginx"
            fi

            echo "=== Na renew ==="
            echo | openssl s_client -connect nexasuite.online:443 -servername nexasuite.online 2>/dev/null \
              | openssl x509 -noout -dates -subject || true
