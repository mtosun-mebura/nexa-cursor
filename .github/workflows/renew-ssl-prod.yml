name: Renew SSL PROD

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Forceer vernieuwing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renew-ssl-production
  cancel-in-progress: false

jobs:
  renew-ssl:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production

    steps:
      - name: Resolve PROD SSH credentials
        id: ssh
        run: |
          set -euo pipefail
          host="${{ secrets.HOSTINGER_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.AWS_HOST }}"
          [[ -z "$host" ]] && host="${{ secrets.DEPLOY_HOST }}"
          user="${{ secrets.HOSTINGER_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.AWS_USER }}"
          [[ -z "$user" ]] && user="${{ secrets.DEPLOY_USER }}"
          port="${{ secrets.HOSTINGER_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.AWS_SSH_PORT }}"
          [[ -z "$port" ]] && port="${{ secrets.DEPLOY_PORT }}"
          port="${port:-22}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Preflight SSH
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
        run: |
          set -euo pipefail
          timeout 25 bash -c "echo >/dev/tcp/${SSH_HOST}/${SSH_PORT:-22}"

      - name: Renew Let's Encrypt
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.AWS_SSH_KEY || secrets.DEPLOY_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          timeout: 60s
          command_timeout: 25m
          script_stop: true
          envs: APP_DIR
          script: |
            set -euo pipefail
            whoami
            id
            FORCE_FLAG=""
            if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force-renewal"; fi

            WEBROOT=""
            for d in \
              "${APP_DIR}/backend/public" \
              "${APP_DIR}/public" \
              /home/ubuntu/nexasuite/backend/public \
              /home/ubuntu/nexa-cursor/backend/public \
              /var/www/certbot
            do
              if [ -n "$d" ] && [ -d "$d" ]; then WEBROOT="$d"; break; fi
            done
            if [ -z "$WEBROOT" ]; then WEBROOT=/var/www/certbot; fi
            echo "WEBROOT=$WEBROOT"

            # Zorg dat challenge-map bestaat (docker root kan schrijven)
            docker run --rm -v "$(dirname "$WEBROOT"):/parent" alpine \
              mkdir -p "/parent/$(basename "$WEBROOT")/.well-known/acme-challenge"

            docker run --rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/log/letsencrypt:/var/log/letsencrypt \
              -v "${WEBROOT}:/webroot" \
              certbot/certbot certonly --webroot -w /webroot \
              -d nexasuite.online \
              --agree-tos --non-interactive --expand ${FORCE_FLAG} \
              --cert-name nexasuite.online \
              -m admin@nexasuite.online

            if sudo -n true 2>/dev/null; then
              sudo -n nginx -t && sudo -n systemctl reload nginx
            else
              echo "Cert vernieuwd. Reload nginx handmatig: sudo systemctl reload nginx"
            fi

            echo | openssl s_client -connect nexasuite.online:443 -servername nexasuite.online 2>/dev/null \
              | openssl x509 -noout -dates -subject || true
