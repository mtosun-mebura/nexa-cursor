name: Inspect PROD
on: workflow_dispatch
jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -euo pipefail
            echo "=== hostname ==="; hostname
            echo "=== docker ps ==="; docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' | head -40
            echo "=== 5432 ==="; ss -ltnp | grep 5432 || netstat -ltnp 2>/dev/null | grep 5432 || true
            echo "=== coolify apps ==="; ls /data/coolify/applications 2>/dev/null | head -20 || true
            echo "=== nexasuite git ==="; git -C /home/ubuntu/nexasuite rev-parse --short HEAD 2>/dev/null; git -C /home/ubuntu/nexasuite describe --tags --always 2>/dev/null || true
